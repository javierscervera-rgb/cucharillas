<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Cucharillas">
  <meta name="theme-color" content="#FFFFFF">
  <title>Cucharillas</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <link rel="icon" href="img/icono-192.png">
  <link rel="stylesheet" href="css/estilos.css">
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
</head>
<body data-pagina="inicio">
  <svg class="decoracion" viewBox="0 0 200 200" aria-hidden="true">
    <path d="M150 10c-40 30-50 80-30 130 40-20 60-70 30-130Z" fill="#E6F7F0"/>
    <path d="M190 60c-35 15-50 50-40 95 35-10 55-50 40-95Z" fill="#EEF7F2"/>
  </svg>

  <main class="contenedor">
    <header class="cabecera-portada">
      <img class="logo-portada" src="img/logo.png" alt="Logo de Cucharillas">
      <div>
        <h1>Cucharillas</h1>
        <p class="saludo" id="saludo">Hola, ¿listo para hoy?</p>
      </div>
    </header>

    <a class="pastilla pastilla-destacada" href="agenda.html">
      <div class="icono-grande">
        <svg viewBox="0 0 64 64" width="56" height="56" aria-hidden="true">
          <rect x="8" y="12" width="40" height="38" rx="8" fill="#6FA9EC"/>
          <rect x="8" y="20" width="40" height="30" rx="0" fill="#EAF3FD"/>
          <rect x="8" y="42" width="40" height="8" rx="0" fill="#EAF3FD"/>
          <path d="M8 44v-2h40v2a6 6 0 0 1-6 6H14a6 6 0 0 1-6-6Z" fill="#EAF3FD"/>
          <rect x="16" y="7" width="4" height="10" rx="2" fill="#2F6FBF"/>
          <rect x="36" y="7" width="4" height="10" rx="2" fill="#2F6FBF"/>
          <g fill="#8EBBF0"><rect x="14" y="25" width="7" height="6" rx="1.5"/><rect x="24.5" y="25" width="7" height="6" rx="1.5"/><rect x="35" y="25" width="7" height="6" rx="1.5"/><rect x="14" y="34" width="7" height="6" rx="1.5"/><rect x="24.5" y="34" width="7" height="6" rx="1.5"/></g>
          <path d="m47 33 3.4 6.9 7.6 1.1-5.5 5.4 1.3 7.6L47 50.4 40.2 54l1.3-7.6-5.5-5.4 7.6-1.1Z" fill="#F6C343" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/>
        </svg>
      </div>
      <div class="texto">
        <div class="titulo">Esta semana</div>
        <div class="detalle">Caminamos, oramos, crecemos...</div>
        <span class="chip" id="chip-semana">…</span>
      </div>
    </a>

    <a class="pastilla" href="lectio.html">
      <div class="icono-pastilla icono-verde" data-icono="libro"></div>
      <div class="texto"><div class="titulo">Lectio Divina</div><div class="detalle" id="det-lectio">Sumérgete en Su Palabra</div></div>
      <span class="flecha" data-icono="flecha"></span>
    </a>

    <a class="pastilla" href="retiro.html">
      <div class="icono-pastilla icono-verde" data-icono="montana"></div>
      <div class="texto"><div class="titulo">Retiro mensual</div><div class="detalle" id="det-retiro">Un rato largo con Dios</div></div>
      <span class="flecha" data-icono="flecha"></span>
    </a>

        <a class="pastilla" href="recursos.html">
      <div class="icono-pastilla icono-ambar" data-icono="video"></div>
      <div class="texto"><div class="titulo">Para leer y ver</div><div class="detalle" id="det-recursos">Artículos, libros y vídeos</div></div>
      <span class="flecha" data-icono="flecha"></span>
    </a>

    <a class="pastilla" href="notas.html">
      <div class="icono-pastilla icono-lila" data-icono="lapiz"></div>
      <div class="texto"><div class="titulo">Mis notas</div><div class="detalle" id="det-notas">Solo en tu móvil</div></div>
      <span class="flecha" data-icono="flecha"></span>
    </a>

    <a class="pastilla" href="agenda.html">
      <div class="icono-pastilla icono-azul" data-icono="calendario"></div>
      <div class="texto"><div class="titulo">Agenda</div><div class="detalle" id="det-agenda">Próximas actividades</div></div>
      <span class="flecha" data-icono="flecha"></span>
    </a>

    <a class="pastilla" href="comunidad.html">
      <div class="icono-pastilla icono-verde" data-icono="personas"></div>
      <div class="texto"><div class="titulo">Todos por todos</div><div class="detalle">Más que solo amigos</div></div>
      <span class="flecha" data-icono="flecha"></span>
    </a>

  </main>

  <script>
    (async function () {
      // Saludo con el nombre del perfil, si lo hay
      try {
        const yo = JSON.parse(localStorage.getItem("cucharillas_mi_perfil") || "null");
        if (yo && yo.nombre) document.getElementById("saludo").textContent = `Hola, ${yo.nombre}. ¿Listo para hoy?`;
      } catch (e) {}

      const n = Object.keys(App.Notas.todas()).length;
      document.getElementById("det-notas").textContent = n ? `${n} nota${n > 1 ? "s" : ""} guardada${n > 1 ? "s" : ""}` : "Solo en tu móvil";

      const [agenda, lectio, retiro] = await Promise.all([App.cargar("agenda"), App.cargar("lectio"), App.cargar("retiro")]);

      const { ini, fin } = App.semanaActual();
      const semana = agenda.entradas.filter(e => { const d = App.aFecha(e.fecha); return d && d >= ini && d <= fin; });
      document.getElementById("chip-semana").textContent =
        semana.length ? `${semana.length} actividad${semana.length > 1 ? "es" : ""}` : "Sin actividades";

      const proxima = App.ordenarPorFecha(agenda.entradas, false).find(e => App.aFecha(e.fecha) >= App.hoy());
      if (proxima) document.getElementById("det-agenda").textContent = `${proxima.titulo} · ${App.fechaLarga(proxima.fecha)}`;

      Promise.all([App.cargar("recursos"), App.cargar("articulos")]).then(([r, a]) => {
        const claves = [...(a.entradas || []).map(x => "art:" + x.id), ...(r.entradas || []).map(x => "rec:" + x.id)];
        const pend = claves.filter(k => !App.Estados.hecho(k)).length;
        if (claves.length) document.getElementById("det-recursos").textContent = pend ? `${pend} pendiente${pend > 1 ? "s" : ""}` : "Todo al día ✓";
      });

      const ul = App.ordenarPorFecha(lectio.entradas)[0];
      if (ul) document.getElementById("det-lectio").textContent = ul.titulo;
      const ur = App.ordenarPorFecha(retiro.entradas)[0];
      if (ur) document.getElementById("det-retiro").textContent = ur.titulo;
    })();
  </script>
</body>
</html>
