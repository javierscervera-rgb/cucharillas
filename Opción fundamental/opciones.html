<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Opciones fundamentales · Cucharillas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&display=swap" rel="stylesheet">
<style>
:root {
  --azul-cielo: #4A90E2;
  --azul-suave: #E8F4FD;
  --verde-menta: #7BC6A4;
  --verde-suave: #E6F7F0;
  --verde-oscuro: #3E9E73;
  --texto-principal: #1F2A44;
  --texto-secundario: #5A6A85;
  --fondo: #FFFFFF;
  --gris-borde: #EEF2F7;
  --rojo: #E5484D;
  --rojo-oscuro: #B4232A;
  --rojo-suave: #FDECEC;
  --tinta: #4A3420;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { overflow-x: hidden; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  color: var(--texto-principal);
  background-color: var(--fondo);
  margin: 0;
  padding: 0;
}
body.sin-scroll { overflow: hidden; }
.contenedor { max-width: 480px; margin: 0 auto; padding: 20px 16px 110px 16px; }
.oculto { display: none !important; }

/* Cabecera */
.cabecera { display: flex; align-items: center; gap: 10px; margin: 4px 0 18px; }
.cabecera h1 { margin: 0; font-size: 26px; font-weight: 700; letter-spacing: -0.3px; }

/* Pantallas */
.pantalla { display: none; }
.pantalla.activa { display: block; animation: entrar .45s ease both; }
@keyframes entrar { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }

/* Pastillas */
.pastilla {
  background: white; border-radius: 18px; padding: 16px 18px; margin-bottom: 12px;
  display: flex; align-items: center; gap: 14px;
  box-shadow: 0 4px 14px rgba(0,0,0,0.06); border: 1px solid var(--gris-borde);
  transition: transform 0.15s ease;
}
.pastilla:active { transform: scale(0.98); }
.pastilla-destacada {
  background: linear-gradient(135deg, #E8F4FD, #F0F9FF); border: none;
  box-shadow: 0 6px 20px rgba(74,144,226,0.12); border-radius: 22px; padding: 20px;
}
.icono-pastilla { width: 44px; height: 44px; border-radius: 14px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-weight: 700; font-size: 17px; }
.icono-azul { background: #E8F4FD; color: var(--azul-cielo); }
.icono-verde { background: #E6F7F0; color: var(--verde-oscuro); }
.icono-lila { background: #F3EFFF; color: #7B61D1; }
.icono-rojo { background: var(--rojo-suave); color: var(--rojo-oscuro); }
.pastilla-txt { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.pastilla-txt strong { font-size: 16px; font-weight: 600; }
.pastilla-txt small { font-size: 13px; color: var(--texto-secundario); }

.chip { display: inline-flex; align-items: center; gap: 7px; background: #fff; color: var(--azul-cielo); font-weight: 600; font-size: 13px; padding: 7px 13px; border-radius: 999px; }
.chip::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.chip-rojo { background: var(--rojo-suave); color: var(--rojo-oscuro); }
.chip-verde { background: var(--verde-suave); color: var(--verde-oscuro); }

.texto-largo { font-size: 16px; line-height: 1.65; }
.texto-largo p { margin: 0 0 14px; }
.seccion-titulo { font-size: 13px; font-weight: 700; letter-spacing: .8px; text-transform: uppercase; color: var(--texto-secundario); margin: 26px 0 12px; }

/* Botones */
.boton-principal {
  width: 100%; border: 0; border-radius: 16px; padding: 16px; font: 600 16px/1.2 inherit; font-family: inherit;
  background: var(--azul-cielo); color: #fff; box-shadow: 0 6px 18px rgba(74,144,226,.3);
  cursor: pointer; transition: transform .15s ease;
}
.boton-principal:active { transform: scale(.98); }
.boton-secundario {
  width: 100%; border: 1px solid var(--gris-borde); border-radius: 16px; padding: 15px; font-weight: 600; font-size: 15px; font-family: inherit;
  background: #fff; color: var(--texto-principal); cursor: pointer; margin-top: 10px;
}
.boton-texto { background: none; border: 0; color: var(--texto-secundario); font: 600 14px inherit; font-family: inherit; padding: 10px; cursor: pointer; }

/* ---------- Pantalla 1: Intro ---------- */
.intro-tarjeta { display: flex; flex-direction: column; align-items: flex-start; gap: 10px; margin-bottom: 22px; }
.intro-tarjeta .icono-grande { width: 64px; height: 64px; border-radius: 20px; background: #fff; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 14px rgba(74,144,226,.15); }
.intro-tarjeta h2 { margin: 6px 0 0; font-size: 26px; font-weight: 700; color: #1E63B8; }
.intro-tarjeta .lema { margin: 0; color: var(--texto-secundario); font-size: 15px; }
#introLista { margin-bottom: 22px; }

/* ---------- Pantalla 2: Pergamino ---------- */
.etiqueta-pantalla { text-align: center; font-size: 13px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--texto-secundario); margin: 0 0 6px; }
.pergamino { position: relative; margin: 6px 6px 22px; padding: 16px 0; }
.pergamino.abierto { animation: desenrollar 1.1s cubic-bezier(.3,.7,.2,1) both; }
@keyframes desenrollar {
  from { clip-path: inset(0 -12px calc(100% - 40px) -12px); }
  to   { clip-path: inset(0 -12px 0 -12px); }
}
.pergamino::before, .pergamino::after {
  content: ""; position: absolute; left: -8px; right: -8px; height: 24px; border-radius: 12px; z-index: 2;
  background: linear-gradient(180deg, #B98A4A 0%, #E9CF97 35%, #F4E2B6 50%, #C79A5A 85%, #9C6F35 100%);
  box-shadow: 0 4px 8px rgba(90,60,20,.28);
}
.pergamino::before { top: 4px; }
.pergamino::after { bottom: 4px; }
.pergamino-papel {
  position: relative; padding: 38px 26px 34px;
  background:
    radial-gradient(ellipse at 15% 8%, rgba(255,255,255,.45), transparent 50%),
    radial-gradient(ellipse at 85% 92%, rgba(150,100,35,.22), transparent 55%),
    radial-gradient(ellipse at 90% 15%, rgba(150,100,35,.12), transparent 40%),
    linear-gradient(90deg, rgba(160,110,40,.18), transparent 8%, transparent 92%, rgba(160,110,40,.18)),
    #F3E2BB;
  box-shadow: inset 0 0 38px rgba(140,95,30,.32), 0 12px 26px rgba(80,50,10,.14);
}
.pergamino-texto {
  position: relative; font-family: "Cormorant Garamond", Georgia, "Times New Roman", serif;
  font-size: 22px; line-height: 1.5; font-weight: 500; color: var(--tinta);
}
.pergamino-texto .fantasma { visibility: hidden; }
.pergamino-texto .escrito { position: absolute; inset: 0; }
.letra { animation: tinta .45s ease both; }
@keyframes tinta { from { opacity: 0; filter: blur(2px); } to { opacity: 1; filter: none; } }
.pluma { display: inline-block; width: 2px; height: 1.05em; background: var(--tinta); vertical-align: -0.15em; margin-left: 1px; animation: parpadeo 1s steps(1) infinite; }
@keyframes parpadeo { 50% { opacity: 0; } }
.pergamino-cita {
  margin: 18px 0 0; text-align: right; font-family: "Cormorant Garamond", Georgia, serif; font-style: italic; font-weight: 600;
  font-size: 18px; color: #7A5226; opacity: 0; transform: translateY(6px); transition: all .6s ease;
}
.pergamino-cita.visible { opacity: 1; transform: none; }
.acciones-biblia { display: flex; flex-direction: column; align-items: center; gap: 6px; }

/* ---------- Pantalla 3: Opción ---------- */
.opcion-cabecera { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
.puntos { display: flex; gap: 5px; }
.puntos i { width: 8px; height: 8px; border-radius: 4px; background: var(--gris-borde); transition: all .3s; }
.puntos i.actual { width: 22px; background: var(--rojo); }
.puntos i.hecho { background: var(--verde-menta); }
.opcion-titulo { font-size: 28px; font-weight: 700; margin: 0 0 18px; letter-spacing: -0.3px; scroll-margin-top: 16px; }
.bloque-cambia { transition: opacity .4s ease, transform .4s ease; }
.bloque-cambia.saliendo { opacity: 0; transform: translateY(8px); }
.subtitulo { font-size: 21px; font-weight: 600; margin: 10px 0 14px; }
.imagen-marco { border-radius: 22px; overflow: hidden; aspect-ratio: 4 / 3; box-shadow: 0 6px 20px rgba(31,42,68,.1); background: var(--azul-suave); }
.imagen-marco img { width: 100%; height: 100%; object-fit: cover; display: block; }
.imagen-vacia { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
.imagen-vacia.rojo { background: linear-gradient(135deg, #FDECEC, #FFF6F2); }
.imagen-vacia.verde { background: linear-gradient(135deg, #E6F7F0, #EEF8FD); }
.imagen-vacia.azul { background: linear-gradient(135deg, #E8F4FD, #F3EFFF); }

/* Slider */
.slider { margin: 24px 0 22px; transition: opacity .6s ease, filter .6s ease; scroll-margin: 120px; }
.slider.bloqueado { opacity: .35; filter: saturate(.5); }
.slider.bloqueado .slider-pista { pointer-events: none; }
.slider-etiquetas { display: flex; justify-content: space-between; gap: 12px; font-size: 13px; font-weight: 700; margin-bottom: 9px; }
.slider-etiquetas span:first-child { color: var(--rojo-oscuro); }
.slider-etiquetas span:last-child { color: var(--texto-secundario); text-align: right; }
.slider.completo .slider-etiquetas span:first-child { color: var(--texto-secundario); }
.slider.completo .slider-etiquetas span:last-child { color: var(--verde-oscuro); }
.slider-pista {
  --p: 0; --pomo: 52px;
  position: relative; height: 60px; border-radius: 30px; background: var(--rojo-suave);
  box-shadow: inset 0 2px 6px rgba(180,35,42,.12); touch-action: none; user-select: none; -webkit-user-select: none;
  cursor: grab; transition: background .6s ease;
}
.slider-relleno {
  position: absolute; left: 4px; top: 4px; bottom: 4px; border-radius: 26px;
  width: calc(var(--pomo) + var(--p) * (100% - 8px - var(--pomo)));
  background: linear-gradient(90deg, #F7A3A3, #E5484D 70%, #C9302C);
  transition: background .6s ease;
}
.slider-pomo {
  position: absolute; top: 4px; left: calc(4px + var(--p) * (100% - 8px - var(--pomo)));
  width: var(--pomo); height: var(--pomo); border-radius: 50%; border: 0; padding: 0;
  background: #fff; box-shadow: 0 4px 12px rgba(150,30,30,.28); color: var(--rojo);
  display: flex; align-items: center; justify-content: center; cursor: grab; z-index: 2;
}
.slider-pista.animando .slider-relleno { transition: width .9s cubic-bezier(.2,.8,.2,1), background .6s ease; }
.slider-pista.animando .slider-pomo { transition: left .9s cubic-bezier(.2,.8,.2,1); }
.slider.activo .slider-pomo { animation: latido 1.8s ease-out infinite; }
@keyframes latido {
  0% { box-shadow: 0 4px 12px rgba(150,30,30,.28), 0 0 0 0 rgba(229,72,77,.45); }
  70% { box-shadow: 0 4px 12px rgba(150,30,30,.28), 0 0 0 14px rgba(229,72,77,0); }
  100% { box-shadow: 0 4px 12px rgba(150,30,30,.28), 0 0 0 0 rgba(229,72,77,0); }
}
.slider-marca {
  position: absolute; top: 50%; width: 10px; height: 10px; margin: -5px 0 0 -5px; border-radius: 50%;
  background: #fff; opacity: .9; box-shadow: 0 0 0 2px rgba(229,72,77,.35); z-index: 1;
  left: calc(4px + var(--pomo) / 2 + var(--k) * (100% - 8px - var(--pomo)));
}
.slider-pomo .ico-check { display: none; }
.slider.completo .slider-pista { background: var(--verde-suave); box-shadow: inset 0 2px 6px rgba(62,158,115,.15); cursor: default; }
.slider.completo .slider-relleno { background: linear-gradient(90deg, #A8DCC4, #7BC6A4 60%, #4FAE85); }
.slider.completo .slider-pomo { color: var(--verde-oscuro); box-shadow: 0 4px 12px rgba(62,158,115,.35); animation: llegada .6s ease; }
.slider.completo .slider-pomo .ico-flechas { display: none; }
.slider.completo .slider-pomo .ico-check { display: block; }
.slider.completo .slider-marca { box-shadow: 0 0 0 2px rgba(62,158,115,.4); }
@keyframes llegada { 40% { transform: scale(1.18); } }
.slider-ayuda { margin: 10px 0 0; text-align: center; font-size: 13px; color: var(--texto-secundario); min-height: 18px; display: flex; align-items: center; justify-content: center; gap: 6px; }
.slider.activo .slider-ayuda { color: var(--rojo-oscuro); font-weight: 600; }
.slider.completo .slider-ayuda { color: var(--verde-oscuro); font-weight: 600; }

#centinela { height: 1px; }

/* Botón grande siguiente opción */
.boton-grande {
  width: 100%; display: flex; flex-direction: column; align-items: flex-start; gap: 4px; text-align: left;
  padding: 20px 56px 20px 22px; border-radius: 22px; border: 0; position: relative; cursor: pointer; font-family: inherit;
  background: linear-gradient(135deg, #7BC6A4, #4FAE85); color: #fff; box-shadow: 0 10px 26px rgba(79,174,133,.38);
  margin-top: 10px; animation: entrar .5s ease both; transition: transform .15s ease;
}
.boton-grande:active { transform: scale(.98); }
.boton-grande small { font-size: 13px; font-weight: 600; opacity: .92; }
.boton-grande span { font-size: 20px; font-weight: 700; line-height: 1.25; }
.boton-grande::after { content: "→"; position: absolute; right: 22px; top: 50%; transform: translateY(-50%); font-size: 24px; font-weight: 700; }

/* Aviso flotante */
.aviso {
  position: fixed; left: 50%; bottom: 96px; transform: translate(-50%, 20px); opacity: 0; pointer-events: none;
  background: var(--rojo); color: #fff; border: 0; border-radius: 999px; padding: 11px 18px; font: 600 14px inherit; font-family: inherit;
  box-shadow: 0 8px 22px rgba(229,72,77,.4); z-index: 150; transition: all .35s ease; white-space: nowrap;
}
.aviso.visible { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }

/* ---------- Hoja emergente (pasos) ---------- */
.hoja-fondo { position: fixed; inset: 0; background: rgba(31,42,68,.38); opacity: 0; pointer-events: none; transition: opacity .3s ease; z-index: 200; }
.hoja-fondo.visible { opacity: 1; pointer-events: auto; }
.hoja {
  position: fixed; left: 0; right: 0; bottom: 0; max-width: 480px; margin: 0 auto; z-index: 201;
  background: #fff; border-radius: 26px 26px 0 0; box-shadow: 0 -10px 30px rgba(0,0,0,.14);
  display: flex; flex-direction: column; max-height: 88vh; max-height: 88dvh;
  transform: translateY(105%); visibility: hidden;
  transition: transform .38s cubic-bezier(.2,.8,.2,1), visibility 0s linear .38s;
}
.hoja.visible { transform: none; visibility: visible; transition: transform .38s cubic-bezier(.2,.8,.2,1), visibility 0s; }
.hoja-asa { width: 40px; height: 5px; border-radius: 3px; background: #DDE3EC; margin: 10px auto 4px; }
.hoja-cabecera { display: flex; align-items: center; justify-content: space-between; padding: 6px 20px 10px; }
.hoja-cerrar { width: 36px; height: 36px; border-radius: 50%; border: 0; background: var(--gris-borde); color: var(--texto-secundario); font-size: 20px; line-height: 1; cursor: pointer; }
.hoja-progreso { display: flex; gap: 6px; padding: 0 20px 14px; }
.hoja-progreso i { flex: 1; height: 5px; border-radius: 3px; background: var(--gris-borde); }
.hoja-progreso i.hecho { background: var(--rojo); }
.hoja-progreso i.actual { background: linear-gradient(90deg, var(--rojo) 50%, var(--rojo-suave) 50%); }
.hoja-cuerpo { overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 0 20px 6px; }
.hoja-cuerpo .imagen-marco { aspect-ratio: 16 / 10; border-radius: 18px; box-shadow: none; }
.hoja-cuerpo h3 { font-size: 22px; font-weight: 700; margin: 16px 0 8px; }
.hoja-cuerpo .texto-largo { color: var(--texto-principal); }
.nota { margin: 6px 0 4px; background: #FAFBFD; border: 1px solid var(--gris-borde); border-radius: 16px; padding: 12px 14px; }
.nota label { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; color: #7B61D1; margin-bottom: 8px; }
.nota textarea {
  width: 100%; min-height: 86px; border: 0; background: transparent; resize: none; outline: none;
  font: 16px/1.5 inherit; font-family: inherit; color: var(--texto-principal); padding: 0;
}
.nota textarea::placeholder { color: #A3AFC2; }
.hoja-pie { padding: 12px 20px calc(16px + env(safe-area-inset-bottom)); border-top: 1px solid var(--gris-borde); }
.hoja-pie .boton-principal { background: var(--rojo); box-shadow: 0 6px 18px rgba(229,72,77,.32); }
.hoja-pie .boton-principal.final { background: linear-gradient(135deg, #7BC6A4, #4FAE85); box-shadow: 0 6px 18px rgba(79,174,133,.35); }

/* ---------- Pantalla final ---------- */
.final-tarjeta { text-align: center; padding: 28px 22px; margin-bottom: 20px; }
.final-tarjeta .icono-grande { width: 64px; height: 64px; border-radius: 20px; background: #fff; display: flex; align-items: center; justify-content: center; margin: 0 auto 12px; box-shadow: 0 4px 14px rgba(74,144,226,.15); }
.final-tarjeta h2 { margin: 0 0 14px; font-size: 24px; color: #1E63B8; }
.oracion { font-family: "Cormorant Garamond", Georgia, serif; font-size: 21px; line-height: 1.55; font-weight: 500; color: var(--texto-principal); }
.oracion p { margin: 0 0 14px; }
.oracion p { animation: entrar .8s ease both; }
.notas-grupo { background: #fff; border: 1px solid var(--gris-borde); border-radius: 18px; padding: 14px 16px; margin-bottom: 12px; box-shadow: 0 4px 14px rgba(0,0,0,.05); }
.notas-grupo h4 { margin: 0 0 8px; font-size: 15px; }
.notas-grupo .nota-item { font-size: 14px; color: var(--texto-secundario); margin: 6px 0 0; line-height: 1.5; }
.notas-grupo .nota-item b { color: var(--texto-principal); font-weight: 600; }

/* ---------- Navegación inferior ---------- */
.nav-inferior {
  position: fixed; bottom: 0; left: 0; right: 0; background: white; display: flex; justify-content: space-around;
  padding: 10px 0 18px 0; box-shadow: 0 -4px 16px rgba(0,0,0,0.05); border-top: 1px solid var(--gris-borde); z-index: 100;
}
.nav-item { display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11px; color: var(--texto-secundario); text-decoration: none; }
.nav-item.activo { color: var(--azul-cielo); }
.nav-item svg { width: 26px; height: 26px; }
</style>
</head>
<body>

<main class="contenedor">
  <header class="cabecera">
    <svg width="28" height="38" viewBox="0 0 30 40" aria-hidden="true">
      <ellipse cx="15" cy="13" rx="10" ry="12.5" fill="#4A90E2"/>
      <rect x="13.6" y="24" width="2.8" height="15" rx="1.4" fill="#4A90E2"/>
      <path d="M15 6.5v12M10.5 11h9" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>
    </svg>
    <h1>Cucharillas</h1>
  </header>

  <!-- PANTALLA 1 · Explicación -->
  <section class="pantalla activa" id="pIntro">
    <div class="pastilla-destacada intro-tarjeta">
      <div class="icono-grande">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#4A90E2" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.5"/><path d="M15.8 8.2l-2.1 5.5-5.5 2.1 2.1-5.5z" fill="#E8F4FD"/></svg>
      </div>
      <h2 id="introTitulo"></h2>
      <p class="lema">Elige la vida</p>
      <span class="chip">4 opciones · 3 pasos cada una</span>
    </div>
    <div class="texto-largo" id="introTexto"></div>
    <h3 class="seccion-titulo">El recorrido</h3>
    <div id="introLista"></div>
    <button class="boton-principal" id="btnComenzar">Comenzar</button>
  </section>

  <!-- PANTALLA 2 · Texto bíblico -->
  <section class="pantalla" id="pBiblia">
    <p class="etiqueta-pantalla">La Palabra</p>
    <div class="pergamino" id="pergamino">
      <div class="pergamino-papel">
        <div class="pergamino-texto">
          <div class="fantasma" id="bibliaFantasma" aria-hidden="true"></div>
          <div class="escrito" id="bibliaTexto"></div>
        </div>
        <p class="pergamino-cita" id="bibliaCita"></p>
      </div>
    </div>
    <div class="acciones-biblia">
      <button class="boton-principal oculto" id="btnBibliaSeguir">Continuar</button>
      <button class="boton-texto" id="btnSaltar">Mostrar todo el texto</button>
    </div>
  </section>

  <!-- PANTALLA 3 · Opción fundamental (x4) -->
  <section class="pantalla" id="pOpcion">
    <div class="opcion-cabecera">
      <span class="chip chip-rojo" id="opNumero"></span>
      <div class="puntos" id="opPuntos"></div>
    </div>
    <h1 class="opcion-titulo" id="opTitulo"></h1>

    <div class="bloque-cambia" id="bloqueArriba">
      <span class="chip chip-rojo" id="opEtiqueta">Punto de partida</span>
      <h2 class="subtitulo" id="opSubtitulo"></h2>
      <div class="imagen-marco" id="opImagen"></div>
    </div>

    <div class="slider bloqueado" id="slider">
      <div class="slider-etiquetas"><span id="sliderDesde"></span><span id="sliderHasta"></span></div>
      <div class="slider-pista" id="sliderPista">
        <div class="slider-relleno"></div>
        <i class="slider-marca" style="--k:0.3333"></i>

        <button class="slider-pomo" id="sliderPomo" type="button" aria-label="Deslizar para avanzar">
          <svg class="ico-flechas" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M7 6l6 6-6 6M13 6l6 6-6 6"/></svg>
          <svg class="ico-check" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
        </button>
      </div>

    <div class="bloque-cambia texto-largo" id="opTexto"></div>

    <div id="opSiguiente" class="oculto">

    </div>
  </section>

  <!-- PANTALLA FINAL · Oración -->
  <section class="pantalla" id="pFinal">
    <div class="pastilla-destacada final-tarjeta">
      <div class="icono-grande">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#4A90E2" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7.5-4.6-7.5-10.2A4.3 4.3 0 0 1 12 8a4.3 4.3 0 0 1 7.5 2.8C19.5 16.4 12 21 12 21z" fill="#E8F4FD"/><path d="M12 10.5v6M9.5 13h5"/></svg>

    <button class="boton-secundario" id="btnRepetir">Repetir el recorrido</button>
  </section>
</main>

<script src="opciones-contenido.js"></script>
<script>
(function () {
  'use strict';
  var CLAVE_CONTENIDO = 'cucharillas_opciones_contenido';
  var CLAVE_NOTAS = 'cucharillas_opciones_notas';
  var $ = function (id) { return document.getElementById(id); };

  /* ---------- Datos ---------- */
  function normalizar(d) {
    d = d || {};
    var t = function (v) { return typeof v === 'string' ? v : ''; };
    var ops = Array.isArray(d.opciones) ? d.opciones : [];
    return {
      tituloJuego: t(d.tituloJuego) || 'Opciones fundamentales',
      explicacion: t(d.explicacion), textoBiblico: t(d.textoBiblico),
      citaBiblica: t(d.citaBiblica), oracion: t(d.oracion),
      opciones: [0, 1, 2, 3].map(function (i) {
        var o = ops[i] || {}; var ps = Array.isArray(o.pasos) ? o.pasos : [];
        return {
          titulo: t(o.titulo) || ('Opción ' + (i + 1)),
          subtitulo1: t(o.subtitulo1), imagen1: t(o.imagen1), texto1: t(o.texto1),
          subtitulo2: t(o.subtitulo2), imagen2: t(o.imagen2), texto2: t(o.texto2),
          pasos: [0, 1, 2].map(function (j) {
            var p = ps[j] || {};
            return { titulo: t(p.titulo) || ('Paso ' + (j + 1)), imagen: t(p.imagen), texto: t(p.texto) };
          })
        };
      })
    };
  }
  function cargar() {
    try { var l = localStorage.getItem(CLAVE_CONTENIDO); if (l) return normalizar(JSON.parse(l)); } catch (e) {}
    return normalizar(window.OPCIONES_CONTENIDO);
  }
  var D = cargar();
  var notas = {};
  try { notas = JSON.parse(localStorage.getItem(CLAVE_NOTAS)) || {}; } catch (e) {}
  function guardarNotas() { try { localStorage.setItem(CLAVE_NOTAS, JSON.stringify(notas)); } catch (e) {} }

  /* ---------- Utilidades ---------- */
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function parrafos(s) {
    if (!s) return '';
    return s.split(/\n\s*\n/).map(function (p) { return '<p>' + esc(p.trim()).replace(/\n/g, '<br>') + '</p>'; }).join('');
  }
  function imagen(src, alt, tono) {
    if (src) return '<img src="' + esc(src) + '" alt="' + esc(alt || '') + '">';
    var color = tono === 'verde' ? '#7BC6A4' : tono === 'rojo' ? '#E5484D' : '#4A90E2';
    return '<div class="imagen-vacia ' + (tono || 'azul') + '"><svg width="54" height="54" viewBox="0 0 24 24" fill="none" stroke="' + color +
      '" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" opacity=".55"><rect x="3" y="4.5" width="18" height="15" rx="3"/><circle cx="9" cy="10" r="1.8"/><path d="M21 16l-5-5-8.5 8.5"/></svg></div>';
  }
  function mostrar(id) {
    document.querySelectorAll('.pantalla').forEach(function (p) { p.classList.toggle('activa', p.id === id); });
    window.scrollTo(0, 0);
  }

  /* ---------- Pantalla 1 ---------- */
  var tonos = ['icono-rojo', 'icono-azul', 'icono-lila', 'icono-verde'];
  $('introTitulo').textContent = D.tituloJuego;
  document.title = D.tituloJuego + ' · Cucharillas';
  $('introTexto').innerHTML = parrafos(D.explicacion);
  $('introLista').innerHTML = D.opciones.map(function (o, i) {
    var ruta = (o.subtitulo1 && o.subtitulo2) ? esc(o.subtitulo1) + ' → ' + esc(o.subtitulo2) : '';
    return '<div class="pastilla"><div class="icono-pastilla ' + tonos[i] + '">' + (i + 1) + '</div>' +
      '<div class="pastilla-txt"><strong>' + esc(o.titulo) + '</strong>' + (ruta ? '<small>' + ruta + '</small>' : '') + '</div></div>';
  }).join('');
  $('btnComenzar').onclick = function () { mostrar('pBiblia'); escribirBiblia(); };

  /* ---------- Pantalla 2: pergamino ---------- */
  var tEscritura = null;
  function escribirBiblia() {
    var txt = D.textoBiblico || '';
    var caja = $('bibliaTexto');
    $('bibliaFantasma').innerHTML = esc(txt).replace(/\n/g, '<br>') + '<span class="pluma"></span>';
    caja.innerHTML = '';
    var pluma = document.createElement('span'); pluma.className = 'pluma'; caja.appendChild(pluma);
    $('bibliaCita').textContent = D.citaBiblica;
    $('bibliaCita').classList.remove('visible');
    $('btnBibliaSeguir').classList.add('oculto');
    $('btnSaltar').classList.remove('oculto');
    var perg = $('pergamino'); perg.classList.remove('abierto'); void perg.offsetWidth; perg.classList.add('abierto');

    var letras = Array.from(txt), i = 0;
    clearTimeout(tEscritura);
    function terminar() {
      clearTimeout(tEscritura);
      pluma.remove();
      $('bibliaCita').classList.add('visible');
      $('btnSaltar').classList.add('oculto');
      $('btnBibliaSeguir').classList.remove('oculto');
    }
    function siguiente() {
      if (i >= letras.length) { terminar(); return; }
      var c = letras[i++];
      if (c === '\n') caja.insertBefore(document.createElement('br'), pluma);
      else { var s = document.createElement('span'); s.className = 'letra'; s.textContent = c; caja.insertBefore(s, pluma); }
      var pausa = 34;
      if (/[,;:]/.test(c)) pausa = 220; else if (/[.!?»]/.test(c)) pausa = 420; else if (c === '\n') pausa = 260;
      tEscritura = setTimeout(siguiente, pausa);
    }
    tEscritura = setTimeout(siguiente, 1150);
    $('btnSaltar').onclick = function () {
      clearTimeout(tEscritura);
      caja.innerHTML = esc(txt).replace(/\n/g, '<br>');
      terminar();
    };
  }
  $('btnBibliaSeguir').onclick = function () { abrirOpcion(0); };

  /* ---------- Pantalla 3: opción fundamental ---------- */
  var op = 0, paso = 0, leido = false, completo = false, progreso = 0, hojaAbierta = false, enTransicion = false;
  var slider = $('slider'), pista = $('sliderPista');
  var obs = null, tLectura = null, tAviso = null;

  function setP(p, animar) {
    pista.classList.toggle('animando', !!animar);
    pista.style.setProperty('--p', p);
  }
  function pintarArriba(n) {
    var o = D.opciones[op];
    var et = $('opEtiqueta');
    et.textContent = n === 1 ? 'Punto de partida' : 'Punto de llegada';
    et.className = 'chip ' + (n === 1 ? 'chip-rojo' : 'chip-verde');
    $('opSubtitulo').textContent = n === 1 ? o.subtitulo1 : o.subtitulo2;
    $('opImagen').innerHTML = imagen(n === 1 ? o.imagen1 : o.imagen2, n === 1 ? o.subtitulo1 : o.subtitulo2, n === 1 ? 'rojo' : 'verde');
  }
  function abrirOpcion(i) {
    op = i; paso = 0; progreso = 0; leido = false; completo = false; enTransicion = false;
    var o = D.opciones[i];
    $('opNumero').textContent = 'Opción fundamental ' + (i + 1) + ' de 4';
    $('opPuntos').innerHTML = D.opciones.map(function (_, k) { return '<i class="' + (k < i ? 'hecho' : k === i ? 'actual' : '') + '"></i>'; }).join('');
    $('opTitulo').textContent = o.titulo;
    pintarArriba(1);
    $('opTexto').innerHTML = parrafos(o.texto1);
    $('sliderDesde').textContent = o.subtitulo1;
    $('sliderHasta').textContent = o.subtitulo2;
    slider.className = 'slider bloqueado';
    setP(0, false);
    $('sliderAyuda').innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg> Lee el texto completo para activarlo';
    $('opSiguiente').classList.add('oculto');
    mostrar('pOpcion');
    observarLectura();
  }
  function observarLectura() {
    if (obs) obs.disconnect();
    clearTimeout(tLectura);
    if (!('IntersectionObserver' in window)) { tLectura = setTimeout(activarSlider, 4000); return; }
    obs = new IntersectionObserver(function (entradas) {
      entradas.forEach(function (en) {
        clearTimeout(tLectura);
        if (en.isIntersecting && !leido) tLectura = setTimeout(activarSlider, 900);
      });
    }, { threshold: 1, rootMargin: '0px 0px -90px 0px' });
    obs.observe($('centinela'));
  }
  function activarSlider() {
    if (leido) return;
    leido = true;
    if (obs) obs.disconnect();
    slider.classList.remove('bloqueado');
    slider.classList.add('activo');
    $('sliderAyuda').textContent = 'Desliza para empezar el camino';
    var r = slider.getBoundingClientRect();
    if (r.bottom < 0 || r.top > window.innerHeight - 90) {
      var a = $('aviso'); a.classList.add('visible');
      clearTimeout(tAviso); tAviso = setTimeout(function () { a.classList.remove('visible'); }, 7000);
    }
  }
  $('aviso').onclick = function () {
    this.classList.remove('visible');
    slider.scrollIntoView({ behavior: 'smooth', block: 'center' });
  };

  /* Arrastre del slider */
  var arrastre = null;
  pista.addEventListener('pointerdown', function (e) {
    if (!leido || completo || hojaAbierta || enTransicion) return;
    arrastre = { x: e.clientX, ancho: Math.max(1, pista.clientWidth - 8 - 52) };
    try { pista.setPointerCapture(e.pointerId); } catch (err) {}
    pista.classList.remove('animando');
    $('aviso').classList.remove('visible');
  });
  pista.addEventListener('pointermove', function (e) {
    if (!arrastre) return;
    var dx = e.clientX - arrastre.x;
    var p = Math.min(progreso + 1 / 3, Math.max(progreso, progreso + dx / arrastre.ancho));
    pista.style.setProperty('--p', p);
  });
  function soltar() {
    if (!arrastre) return;
    arrastre = null;
    setP(progreso, true);
    abrirHoja();
  }
  pista.addEventListener('pointerup', soltar);
  pista.addEventListener('pointercancel', function () { arrastre = null; setP(progreso, true); });
  $('sliderPomo').addEventListener('click', function () { if (!hojaAbierta && leido && !completo && !enTransicion) abrirHoja(); });

  /* ---------- Hoja de pasos ---------- */
  var nota = $('hojaNota');
  function abrirHoja() {
    if (hojaAbierta || !leido || completo) return;
    hojaAbierta = true;
    var o = D.opciones[op], p = o.pasos[paso], clave = 'o' + op + 'p' + paso;
    $('hojaPaso').textContent = 'Paso ' + (paso + 1) + ' de 3';
    Array.prototype.forEach.call($('hojaProgreso').children, function (seg, k) {
      seg.className = k < paso ? 'hecho' : k === paso ? 'actual' : '';
    });
    $('hojaImagen').innerHTML = imagen(p.imagen, p.titulo, 'rojo');
    $('hojaTitulo').textContent = p.titulo;
    $('hojaTexto').innerHTML = parrafos(p.texto);
    nota.value = notas[clave] || '';
    nota.oninput = function () { notas[clave] = nota.value; guardarNotas(); };
    var btn = $('btnSiguientePaso');
    btn.textContent = paso < 2 ? 'Siguiente paso →' : 'Completar el camino ✓';
    btn.classList.toggle('final', paso === 2);
    $('hojaCuerpo').scrollTop = 0;
    $('hojaFondo').classList.add('visible');
    $('hoja').classList.add('visible');
    document.body.classList.add('sin-scroll');
  }
  function cerrarHoja() {
    hojaAbierta = false;
    nota.blur();
    $('hojaFondo').classList.remove('visible');
    $('hoja').classList.remove('visible');
    document.body.classList.remove('sin-scroll');
  }
  $('hojaCerrar').onclick = cerrarHoja;
  $('hojaFondo').onclick = cerrarHoja;

  $('btnSiguientePaso').onclick = function () {
    cerrarHoja();
    enTransicion = true;
    paso++;
    var r = slider.getBoundingClientRect();
    if (r.top < 0 || r.bottom > window.innerHeight - 90) slider.scrollIntoView({ behavior: 'smooth', block: 'center' });
    setTimeout(function () {
      progreso = paso / 3;
      setP(progreso, true);
      if (paso < 3) {
        $('sliderAyuda').textContent = 'Paso ' + paso + ' de 3 completado';
        setTimeout(function () { enTransicion = false; abrirHoja(); }, 1200);
      } else {
        setTimeout(function () { enTransicion = false; completar(); }, 950);
      }
    }, 420);
  };

  function completar() {
    completo = true;
    slider.classList.remove('activo');
    slider.classList.add('completo');
    $('sliderAyuda').textContent = '¡Camino recorrido!';
    var arriba = $('bloqueArriba'), texto = $('opTexto');
    arriba.classList.add('saliendo'); texto.classList.add('saliendo');
    setTimeout(function () {
      pintarArriba(2);
      texto.innerHTML = parrafos(D.opciones[op].texto2);
      arriba.classList.remove('saliendo'); texto.classList.remove('saliendo');
      var btn = $('btnSiguienteOpcion');
      if (op < 3) {
        btn.innerHTML = '<small>Pasa a la opción fundamental nº ' + (op + 2) + ':</small><span>' + esc(D.opciones[op + 1].titulo) + '</span>';
      } else {
        btn.innerHTML = '<small>Has recorrido las 4 opciones fundamentales</small><span>Ir a la oración final</span>';
      }
      $('opSiguiente').classList.remove('oculto');
      $('opTitulo').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }, 450);
  }
  $('btnSiguienteOpcion').onclick = function () { if (op < 3) abrirOpcion(op + 1); else abrirFinal(); };

  /* ---------- Pantalla final ---------- */
  function abrirFinal() {
    var ora = $('finalTexto');
    ora.innerHTML = parrafos(D.oracion);
    Array.prototype.forEach.call(ora.children, function (p, k) { p.style.animationDelay = (0.3 + k * 0.5) + 's'; });
    var html = '';
    D.opciones.forEach(function (o, i) {
      var items = o.pasos.map(function (p, j) {
        var n = (notas['o' + i + 'p' + j] || '').trim();
        return n ? '<p class="nota-item"><b>' + esc(p.titulo) + ':</b> ' + esc(n).replace(/\n/g, '<br>') + '</p>' : '';
      }).join('');
      if (items) html += '<div class="notas-grupo"><h4>' + (i + 1) + '. ' + esc(o.titulo) + '</h4>' + items + '</div>';
    });
    $('finalNotas').innerHTML = html ? '<h3 class="seccion-titulo">Tus notas del recorrido</h3>' + html + '<div style="height:10px"></div>' : '';
    mostrar('pFinal');
  }
  $('btnRepetir').onclick = function () { mostrar('pIntro'); };
})();
</script>
