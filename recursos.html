<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Cucharillas">
  <meta name="theme-color" content="#FFFFFF">
  <title>Libros y vídeos · Cucharillas</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <link rel="icon" href="img/icono-192.png">
  <link rel="stylesheet" href="css/estilos.css">
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
</head>
<body data-pagina="recursos">
  <main class="contenedor">
    <header class="cabecera-pagina">
      <a class="btn-volver" href="index.html" aria-label="Volver" data-icono="atras"></a>
      <h1>Libros y vídeos</h1>
    </header>
    <p class="subtitulo">Lo que el grupo te recomienda.</p>
    <div id="contenido"><div class="cargando">Cargando…</div></div>
  </main>

  <script>
    (async function () {
      const cont = document.getElementById("contenido");
      const { entradas } = await App.cargar("recursos");
      if (!entradas.length) { cont.innerHTML = `<div class="vacio">Aún no hay recomendaciones.</div>`; return; }
      const estilo = { "Libro": ["libro", "verde"], "Vídeo": ["video", "azul"], "Podcast": ["reloj", "lila"], "Música": ["corazon", "lila"], "Web": ["enlace", "ambar"] };
      const plural = { "Libro": "Libros", "Vídeo": "Vídeos", "Podcast": "Podcasts", "Música": "Música", "Web": "Webs" };
      const tipos = [...new Set(entradas.map(e => e.tipo || "Otros"))];
      cont.innerHTML = tipos.map(t => `<h3 class="titulo-grupo">${App.escapar(plural[t] || t)}</h3>` +
        entradas.filter(e => (e.tipo || "Otros") === t).map(e => {
          const [ic, col] = estilo[e.tipo] || ["estrella", "ambar"];
          const enlace = /^https?:\/\//.test(e.enlace || "") ? e.enlace : "";
          return `<div class="pastilla columna">
            <div class="fila">
              <div class="icono-pastilla icono-${col}">${App.ICONOS[ic]}</div>
              <div class="texto"><div class="titulo">${App.escapar(e.titulo)}</div>
              ${e.autor ? `<div class="detalle">${App.escapar(e.autor)}</div>` : ""}</div>
            </div>
            ${e.descripcion ? `<div class="detalle" style="margin-top:10px;font-size:14.5px">${App.escapar(e.descripcion)}</div>` : ""}
            ${enlace ? `<a class="boton secundario" style="margin-top:12px;padding:10px" href="${App.escapar(enlace)}" target="_blank" rel="noopener">${App.ICONOS.enlace} Abrir</a>` : ""}
          </div>`;
        }).join("")).join("");
    })();
  </script>
</body>
</html>
