<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Cucharillas">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#FFFFFF">
  <title>Entrar · Cucharillas</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <link rel="icon" href="img/icono-192.png">
  <link rel="stylesheet" href="css/estilos.css">
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
  <style>
    .acceso { max-width: 420px; margin: 0 auto; padding-top: 8px; }
    .acceso-cab { text-align: center; margin: 6px 0 22px; }
    .acceso-cab img { height: 110px; display: block; margin: 0 auto 8px; }
    .acceso-cab h1 { margin: 0 0 4px; font-size: 28px; }
    .acceso-cab p { margin: 0; color: var(--texto-secundario); }
    .acceso .pestanas button { flex: 1; }
    .acceso .campo:first-child { margin-top: 0; }
    .acceso input { width: 100%; box-sizing: border-box; }
    .ayuda-campo { display: block; font-size: 12.5px; color: var(--texto-secundario); margin: 6px 2px 0; }
    .error-acceso { color: #B4232A; font-size: 14.5px; margin: 12px 2px 0; min-height: 20px; }
    .ver-clave { position: relative; }
    .ver-clave input { padding-right: 70px; }
    .ver-clave button { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); border: 0; background: none; color: var(--azul-cielo); font: 600 13px inherit; font-family: inherit; padding: 8px; cursor: pointer; }
    .pie-acceso { text-align: center; color: var(--texto-secundario); font-size: 13.5px; margin-top: 18px; line-height: 1.5; }
    .pie-acceso a { color: var(--azul-cielo); }
    .pasos-registro { display: flex; align-items: center; gap: 6px; margin: 0 0 16px; }
    .pasos-registro i { width: 26px; height: 5px; border-radius: 3px; background: var(--gris-borde); }
    .pasos-registro i.hecho { background: var(--verde-menta); }
    .pasos-registro i.actual { background: var(--azul-cielo); }
    .pasos-registro span { margin-left: 6px; font-size: 12.5px; font-weight: 600; color: var(--texto-secundario); }
    .titulo-quien { margin: 0 0 4px; font-size: 21px; }
    .texto-quien { margin: 0 0 12px; color: var(--texto-secundario); font-size: 14.5px; line-height: 1.5; }
    .buscar-quien { width: 100%; box-sizing: border-box; margin-bottom: 10px; }
    .lista-quien { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; max-height: 52vh; overflow-y: auto; padding: 2px; }
    .quien { display: flex; align-items: center; gap: 10px; border: 1px solid var(--gris-borde); background: #fff; border-radius: 14px; padding: 8px 10px; font: 600 14.5px inherit; font-family: inherit; color: var(--texto-principal); text-align: left; cursor: pointer; min-width: 0; }
    .quien span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .quien .avatar { flex-shrink: 0; }
    .quien:active, .quien:hover { border-color: var(--azul-cielo); background: var(--azul-suave); }
    .elegido { display: flex; align-items: center; gap: 12px; background: var(--verde-suave); border-radius: 16px; padding: 10px 12px; margin-bottom: 4px; }
    .elegido > div:not(.avatar) { flex: 1; min-width: 0; }
    .elegido .avatar { flex: 0 0 44px; }
    .elegido b { display: block; }
    .elegido small { color: #2C7A57; font-size: 13px; }
    .elegido button { border: 0; background: none; color: var(--azul-cielo); font: 600 13.5px inherit; font-family: inherit; cursor: pointer; padding: 6px; }
  </style>
</head>
<body data-pagina="entrar">
  <main class="contenedor" style="padding-bottom:40px">
    <div class="acceso" id="acceso"></div>
  </main>

<script>
(function () {
  "use strict";
  const { escapar, Sesion } = App;
  const raiz = document.getElementById("acceso");
  const params = new URLSearchParams(location.search);
  const sesion = Sesion.obtener();
  let modo = params.get("modo") === "clave" && sesion ? "clave" : (params.get("modo") === "registro" ? "registro" : "entrar");
  // Registro en tres pasos: 1 código del grupo, 2 ¿quién eres?, 3 usuario y contraseña
  const R = { paso: 1, codigo: "", libres: [], elegido: null, filtro: "" };

  // Si ya hay sesión y no viene a cambiar la contraseña, a la app
  if (sesion && modo !== "clave") return volver();

  function volver() {
    const v = params.get("v") || "";
    // Solo rutas de esta misma web
    location.replace(/^\/(?!\/)/.test(v) && !/entrar\.html/.test(v) ? v : "index.html");
  }

  const campoClave = (id, etiqueta, auto) => `
    <label class="campo" for="${id}">${etiqueta}</label>
    <div class="ver-clave"><input id="${id}" type="password" autocomplete="${auto}" required minlength="6">
    <button type="button" data-ver="${id}">Mostrar</button></div>`;

  function cabecera() {
    return `<div class="acceso-cab"><img src="img/logo.png" alt="Logo de Cucharillas"><h1>Cucharillas</h1>
      <p>${modo === "clave" ? "Cambia tu contraseña" : "La app del grupo"}</p></div>`;
  }
  const pestanas = () => `
    <div class="pestanas" role="tablist">
      <button type="button" data-modo="entrar" class="${modo === "entrar" ? "activa" : ""}">Entrar</button>
      <button type="button" data-modo="registro" class="${modo === "registro" ? "activa" : ""}">Registrarme</button>
    </div>`;
  const pasos = () => `<div class="pasos-registro">${[1, 2, 3].map(n => `<i class="${n < R.paso ? "hecho" : n === R.paso ? "actual" : ""}"></i>`).join("")}<span>Paso ${R.paso} de 3</span></div>`;

  function pintar(error) {
    if (modo === "clave") {
      raiz.innerHTML = cabecera() + `
        <form class="ficha" id="form">
          <p style="margin:0 0 6px;color:var(--texto-secundario)">Has entrado como <b>${escapar(sesion.cuenta.nombre)}</b> (${escapar(sesion.cuenta.usuario)}).</p>
          ${campoClave("actual", "Contraseña actual", "current-password")}
          ${campoClave("nueva", "Contraseña nueva", "new-password")}
          <span class="ayuda-campo">Mínimo 6 caracteres.</span>
          <p class="error-acceso" id="error">${escapar(error || "")}</p>
          <button class="boton ancho" type="submit" id="enviar">Cambiar contraseña</button>
        </form>
        <p class="pie-acceso"><a href="index.html">Volver a la app</a></p>`;
    } else if (modo === "entrar") {
      raiz.innerHTML = cabecera() + pestanas() + `
        <form class="ficha" id="form" autocomplete="on">
          <label class="campo" for="usuario">Usuario</label>
          <input id="usuario" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" maxlength="20" required>
          ${campoClave("clave", "Contraseña", "current-password")}
          <p class="error-acceso" id="error">${escapar(error || "")}</p>
          <button class="boton ancho" type="submit" id="enviar">Entrar</button>
        </form>
        <p class="pie-acceso">¿Has olvidado la contraseña? Pide a un responsable que te la cambie.</p>`;
    } else if (R.paso === 1) {
      raiz.innerHTML = cabecera() + pestanas() + `
        <form class="ficha" id="form">
          ${pasos()}
          <label class="campo" for="codigo">Código del grupo</label>
          <input id="codigo" autocomplete="off" autocapitalize="none" required placeholder="Te lo dan los responsables" value="${escapar(R.codigo)}">
          <span class="ayuda-campo">Solo pueden registrarse las personas del grupo.</span>
          <p class="error-acceso" id="error">${escapar(error || "")}</p>
          <button class="boton ancho" type="submit" id="enviar">Continuar</button>
        </form>`;
    } else if (R.paso === 2) {
      raiz.innerHTML = cabecera() + pestanas() + `
        <div class="ficha">
          ${pasos()}
          <h2 class="titulo-quien">¿Quién eres?</h2>
          <p class="texto-quien">Si ya subiste tu perfil a «Todos por todos», búscate en la lista y lo recuperarás con tu cuenta.</p>
          ${R.libres.length > 6 ? `<input id="filtro" class="buscar-quien" placeholder="Buscar mi nombre…" value="${escapar(R.filtro)}" autocomplete="off">` : ""}
          <div class="lista-quien" id="listaQuien"></div>
          <button class="boton suave ancho" type="button" id="noEstoy" style="margin-top:12px">No estoy en la lista</button>
        </div>
        <p class="pie-acceso"><a href="#" id="atras">← Volver</a></p>`;
      pintarLista();
      const f = document.getElementById("filtro");
      if (f) f.oninput = () => { R.filtro = f.value; pintarLista(); };
      document.getElementById("noEstoy").onclick = () => { R.elegido = null; R.paso = 3; pintar(); };
      document.getElementById("atras").onclick = (ev) => { ev.preventDefault(); R.paso = 1; pintar(); };
    } else {
      const e = R.elegido;
      raiz.innerHTML = cabecera() + pestanas() + `
        <form class="ficha" id="form" autocomplete="on">
          ${pasos()}
          ${e ? `<div class="elegido">${App.avatar(e, 44)}<div><b>${escapar(e.nombre)}</b><small>Recuperarás este perfil</small></div><button type="button" id="cambiarQuien">Cambiar</button></div>` : ""}
          <label class="campo" for="nombre">Tu nombre</label>
          <input id="nombre" autocomplete="given-name" maxlength="30" required placeholder="Como te conocen en el grupo" value="${escapar(e ? e.nombre : "")}">
          <span class="ayuda-campo">Saldrá junto a tus fotos y comentarios.</span>
          <label class="campo" for="usuario">Usuario</label>
          <input id="usuario" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" maxlength="20" required placeholder="Ej.: ana.garcia">
          <span class="ayuda-campo">De 3 a 20 letras o números, sin espacios ni tildes. Lo usarás para entrar.</span>
          ${campoClave("clave", "Contraseña", "new-password")}
          <span class="ayuda-campo">Mínimo 6 caracteres.</span>
          <p class="error-acceso" id="error">${escapar(error || "")}</p>
          <button class="boton ancho" type="submit" id="enviar">Crear mi cuenta</button>
        </form>
        <p class="pie-acceso"><a href="#" id="atras">← Volver</a></p>`;
      const c = document.getElementById("cambiarQuien");
      if (c) c.onclick = () => { R.paso = 2; pintar(); };
      document.getElementById("atras").onclick = (ev) => { ev.preventDefault(); R.paso = R.libres.length ? 2 : 1; pintar(); };
    }
    raiz.querySelectorAll("[data-modo]").forEach(b => b.onclick = () => { modo = b.dataset.modo; pintar(); });
    raiz.querySelectorAll("[data-ver]").forEach(b => b.onclick = () => {
      const i = document.getElementById(b.dataset.ver);
      i.type = i.type === "password" ? "text" : "password";
      b.textContent = i.type === "password" ? "Mostrar" : "Ocultar";
    });
    const form = document.getElementById("form");
    if (form) form.onsubmit = enviar;
  }

  function pintarLista() {
    const caja = document.getElementById("listaQuien");
    const q = R.filtro.trim().toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
    const lista = R.libres.filter(p => !q || p.nombre.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").includes(q));
    caja.innerHTML = lista.length
      ? lista.map(p => `<button type="button" class="quien" data-id="${escapar(p.id)}">${App.avatar(p, 40)}<span>${escapar(p.nombre)}</span></button>`).join("")
      : `<p class="texto-quien" style="text-align:center;margin:14px 0">${R.libres.length ? "No hay nadie con ese nombre." : "No hay perfiles pendientes de recuperar."}</p>`;
    caja.querySelectorAll("[data-id]").forEach(b => b.onclick = () => {
      R.elegido = R.libres.find(p => p.id === b.dataset.id); R.paso = 3; pintar();
    });
  }

  async function enviar(ev) {
    ev.preventDefault();
    const err = document.getElementById("error"), btn = document.getElementById("enviar");
    const val = (id) => (document.getElementById(id) || {}).value || "";
    err.textContent = "";
    const texto = btn.textContent;
    btn.disabled = true; btn.textContent = "Un momento…";
    try {
      if (modo === "clave") {
        if (val("nueva").length < 6) throw new Error("La contraseña nueva debe tener al menos 6 caracteres");
        const u = sesion.cuenta.usuario;
        const j = await App.servidorCuentas("cambiarClave", { token: sesion.token, hash: await App.hashClave(u, val("actual")), nuevo: await App.hashClave(u, val("nueva")) });
        Sesion.guardar(j.token, j.cuenta);
        App.aviso("Contraseña cambiada ✓");
        setTimeout(() => location.replace("index.html"), 900);
        return;
      }
      if (modo === "registro" && R.paso === 1) {
        R.codigo = val("codigo").trim();
        const j = await App.servidorCuentas("libres", { codigo: R.codigo });
        R.libres = j.libres || []; R.filtro = "";
        R.paso = R.libres.length ? 2 : 3; R.elegido = null;
        return pintar();
      }
      const usuario = val("usuario").trim().toLowerCase();
      if (modo === "registro") {
        if (!/^[a-z0-9._-]{3,20}$/.test(usuario)) throw new Error("El usuario debe tener de 3 a 20 letras o números, sin espacios ni tildes");
        if (val("clave").length < 6) throw new Error("La contraseña debe tener al menos 6 caracteres");
      }
      const hash = await App.hashClave(usuario, val("clave"));
      const j = modo === "registro"
        ? await App.servidorCuentas("registrar", { usuario, nombre: val("nombre").trim(), codigo: R.codigo, hash, perfil: R.elegido ? R.elegido.id : undefined })
        : await App.servidorCuentas("entrar", { usuario, hash });
      Sesion.guardar(j.token, j.cuenta);
      if (j.perfil) { btn.textContent = "Recuperando tu perfil…"; await App.recuperarPerfil(j.perfil); }
      volver();
    } catch (e) {
      btn.disabled = false; btn.textContent = texto;
      if (e.codigo === "sesion") { Sesion.cerrar(); modo = "entrar"; return pintar("Tu sesión ha caducado. Vuelve a entrar."); }
      if (e.codigo === "codigo") { R.paso = 1; return pintar("El código del grupo no es correcto"); }
      if (e.codigo === "perfil-ocupado") {
        R.libres = R.libres.filter(p => !R.elegido || p.id !== R.elegido.id); R.elegido = null; R.paso = 2;
        return pintar(), App.aviso("Esa persona ya se ha registrado. Si eres tú, avisa a un responsable");
      }
      err.textContent = e.codigo === "sin-activar" ? "El acceso todavía no está activado. Avisa a un responsable." : e.message;
    }
  }

  pintar();
})();
</script>
</body>
</html>
